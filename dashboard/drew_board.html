<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drew - Callahan Command Board</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  :root {
    --canvas:  #F2F0EB;
    --card:    #FFFFFF;
    --nav:     #0F2035;
    --divider: #E8E4DC;
    --text-primary:   #1A1814;
    --text-secondary: #5C574F;
    --text-muted:     #9C9589;
    --p1:   #B91C1C;
    --p2:   #C2410C;
    --p3:   #1D4E89;
    --dvi-t: #0F766E;
    --dvi-r: #6D28D9;
    --adv:   #92400E;
  }
  body { font-family: 'Inter', sans-serif; background: var(--canvas); color: var(--text-primary); }
  .mono { font-family: 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums; }
  .lane-urgent  { --rail-color: var(--p1); border: 1px solid var(--divider); background: rgba(255,255,255,0.35); }
  .lane-warn    { --rail-color: var(--p2); border: 1px solid var(--divider); background: rgba(255,255,255,0.35); }
  .lane-calm    { --rail-color: var(--p3); border: 1px solid var(--divider); background: rgba(255,255,255,0.35); }
  .lane-done    { --rail-color: #4ADE80; border: 1px solid var(--divider); background: rgba(255,255,255,0.35); }
  .job-card     { position: relative; overflow: hidden; border: 1px solid var(--divider); background: var(--card); color: var(--text-primary); box-shadow: 0 12px 28px rgba(15,32,53,0.08); transition: transform 0.15s, box-shadow 0.15s; }
  .job-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--rail-color, var(--text-muted)); }
  .job-card:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(15,32,53,0.12); }
  .job-card .text-zinc-100 { color: var(--text-primary) !important; }
  .job-card .text-zinc-300, .job-card .text-zinc-400 { color: var(--text-secondary) !important; }
  .job-card .text-zinc-500, .job-card .text-zinc-600 { color: var(--text-muted) !important; }
  .job-card textarea, .job-card select { background: color-mix(in srgb, var(--canvas) 72%, var(--card)) !important; border-color: var(--divider) !important; color: var(--text-primary) !important; }
  .pulse-urgent { animation: pulseUrgent 1.2s ease-in-out infinite; }
  @keyframes pulseUrgent {
    0%,100% { border-color: #dc2626; box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    50%      { border-color: #ef4444; box-shadow: 0 0 0 6px rgba(220,38,38,0.15); }
  }
  .callie-bubble { border-left: 3px solid #8b5cf6; background: rgba(139,92,246,0.07); }
  .step-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.06em; }
  .confirm-btn {
    background: rgba(34,197,94,0.12);
    border: 1px solid #16a34a;
    color: #86efac;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .confirm-btn:hover { background: rgba(34,197,94,0.25); }
  .confirm-btn.done {
    background: rgba(39,39,42,0.8);
    border-color: #3f3f46;
    color: #52525b;
    cursor: default;
  }
  .help-panel { display: none; }
  .help-panel.open { display: block; }
  .overdue-time { color: #f87171; font-weight: 700; }
  .warn-time    { color: #fbbf24; font-weight: 600; }
  .ok-time      { color: #71717a; }
  .nav-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid #3f3f46;
    background: #18181b;
    color: #a1a1aa;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s;
  }
  .nav-btn:hover { border-color: #71717a; color: #f4f4f5; }
  .nav-btn.active { background: #27272a; border-color: #71717a; color: #f4f4f5; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: livepulse 2s ease-in-out infinite; }
  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .callie-alert {
    background: color-mix(in srgb, var(--adv) 8%, var(--card));
    border: 1px solid color-mix(in srgb, var(--adv) 24%, var(--divider));
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    animation: callieIn 0.4s ease-out;
  }
  @keyframes callieIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .summary-pill {
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0F1419;
      --card:   #1A2535;
      --divider: #2A3545;
      --text-primary:   #E8E4DC;
      --text-secondary: #94A3B8;
      --text-muted:     #64748B;
    }
    body { background: var(--canvas); }
  }
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<div class="sticky top-0 z-50 border-b border-zinc-800 bg-zinc-950/95 backdrop-blur px-6 py-3">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <div class="text-xs mono text-zinc-500 uppercase tracking-widest">Powered by</div>
        <div class="text-sm font-black text-zinc-100 tracking-tight">AdvizMe<span class="text-violet-400">.ai</span></div>
      </div>
      <div class="w-px h-5 bg-zinc-700"></div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center text-xs font-black text-white">DM</div>
        <div>
          <div class="text-sm font-bold leading-none">Drew Mize</div>
          <div class="text-[10px] text-zinc-500 mono uppercase tracking-wider mt-0.5">Shop-Side Advisor</div>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a href="/" class="nav-btn">Main Board</a>
      <a href="/drew" class="nav-btn active">Drew</a>
      <a href="/mitch" class="nav-btn">Mitch</a>
      <div class="flex items-center gap-2 ml-2">
        <div class="live-dot"></div>
        <div class="text-xs mono text-zinc-500" id="clock">--:--</div>
      </div>
    </div>
  </div>
</div>

<!-- CALLIE ALERT BANNER -->
<div id="callie-banner" class="hidden px-6 pt-4">
  <div class="callie-alert">
    <div class="flex items-start gap-3">
      <div class="text-violet-400 text-lg mt-0.5">[Callie]</div>
      <div>
        <div class="text-[10px] mono text-violet-400 uppercase tracking-widest mb-1">Callie</div>
        <div class="text-sm text-zinc-100 leading-relaxed" id="callie-banner-text"></div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="px-6 py-4" id="main-content">
  <div class="text-zinc-500 text-sm py-12 text-center mono">Loading your queue...</div>
</div>

<script>
const API = '/api/board-state';
const POLL_MS = 30000;
const ADVISOR = 'drew';

// -- Callie's voice for Drew ---------------------------------------
const CALLIE = {
  dviReady: (ro, customer, tech, mins) =>
    `RO ${ro} - ${customer}'s vehicle has been in DVI Updates for ${mins} minutes. ${tech} finished the inspection. You've got a tight window before the estimate slot closes today - want to knock this out now while the car's still on the rack?`,
  dviOverdue: (ro, customer, mins) =>
    `Drew, RO ${ro} - ${customer} has been waiting ${mins} minutes for the DVI review. That's past the window. Let's get Phase 2 running right now so Mitch can build the estimate and we don't lose the day on this one.`,
  estimateReady: (ro, customer) =>
    `The structure on RO ${ro} for ${customer} is ready for Mitch - but it needs your audit pass first. Shouldn't take long. Let's make sure nothing's missing before it goes to the customer.`,
  qcReady: (ro, customer) =>
    `RO ${ro} - ${customer}'s vehicle is ready for your QC check. Take a quick walk around before we call it done. This is the last line of defense before the customer sees it.`,
  finalizeReady: (ro, customer) =>
    `RO ${ro} - ${customer}'s ticket needs to be finalized and handed to Mitch. Clean up the notes, confirm the charges match, and let's get this one closed out.`,
  morningGreeting: (name, count, firstPriority) =>
    `Good morning, ${name}. You've got ${count} active jobs today. Your first priority is ${firstPriority}. Let's make it a strong one.`,
  nothingOverdue: () =>
    `You're in good shape right now - nothing overdue. Keep the momentum going and stay ahead of the DVIs when they land.`,
  confirmResponse: (step, ro, nextStep, mins) =>
    `Got it - ${step} logged for RO ${ro} at ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}. That took ${mins} minutes. Next: ${nextStep}.`,
};

// -- Drew's workflow buckets ----------------------------------------
const BUCKETS = [
  {
    id: 'unknown', step: 'STEP 1', title: 'Needs Attention - Status Unknown',
    statuses: ['unknown'],
    timing: 20, urgent: true,
    action: 'Check AutoFlow - clarify what is happening with this job - update status',
    help: 'This job has no clear status. Check AutoFlow and find out where it actually stands. Update the status so the board can route it correctly. Do not let unknown jobs sit - they are invisible to everyone.',
    nextStep: 'Update status in AutoFlow so job routes correctly',
    callieUrgent: (j, mins) => `Drew - RO ${j.ro}, ${j.customer || 'Unknown'} has been sitting with no clear status for ${mins} minutes. Something needs to happen here. Check AutoFlow and tell me where this one actually stands.`,
  },
  {
    id: 'servicing', step: 'STEP 2', title: 'In Production - Monitor & Mid-Job Check',
    statuses: ['servicing'],
    timing: 120, urgent: false,
    action: 'Check tech progress - take mid-job photos on larger jobs - post activity update - notify Mitch if timeline changes',
    help: 'Job is actively being worked on. On larger jobs - teardowns, engine work, gasket jobs, anything over 2 hours - take mid-job photos around the halfway point. Post a Tekmetric activity update with current stage, visible progress, and rough completion time. If the timeline is shifting, tell Mitch immediately so he can update the customer.',
    nextStep: 'Flag incoming soon when within 2 hours of completion',
  },
  {
    id: 'parts', step: 'STEP 3', title: 'Parts - Verify Received & Staged',
    statuses: ['parts'],
    timing: 60, urgent: false,
    action: 'Check if parts arrived - verify against RO - stage next to vehicle - update status',
    help: 'Check the parts status. If arrived: pull them, verify every part against the RO, and stage them next to the vehicle. Update AutoFlow so the board reflects reality. If still waiting: confirm the ETA with the supplier and make sure Mitch has updated the customer.',
    nextStep: 'Notify Mitch when parts are staged and ready to go',
  },
];

// -- State ---------------------------------------------------------
let boardState = null;
let confirmations = JSON.parse(localStorage.getItem('drew_confirms') || '{}');
let notes = JSON.parse(localStorage.getItem('drew_notes') || '{}');
let lastCallieMessage = '';

function saveConfirm(ro, bucketId, mins) {
  const key = ro + '_' + bucketId;
  const next = (BUCKETS.find(b => b.id === bucketId) || {}).nextStep || 'Keep moving.';
  confirmations[key] = {
    ts: new Date().toISOString(),
    mins: mins,
    next: next,
  };
  localStorage.setItem('drew_confirms', JSON.stringify(confirmations));
  return CALLIE.confirmResponse(
    (BUCKETS.find(b => b.id === bucketId) || {}).title || bucketId,
    ro, next, mins
  );
}

function getConfirm(ro, bucketId) {
  return confirmations[ro + '_' + bucketId];
}

function noteKey(ro) {
  return String(ro || 'unknown');
}

function getNote(ro) {
  return notes[noteKey(ro)] || '';
}

function saveNote(ro, value) {
  const key = noteKey(ro);
  const trimmed = String(value || '').trim();
  if (trimmed) notes[key] = trimmed;
  else delete notes[key];
  localStorage.setItem('drew_notes', JSON.stringify(notes));
}

function minsAgo(iso) {
  if (!iso) return null;
  const parsed = new Date(iso);
  if (Number.isNaN(parsed.getTime())) return null;
  return Math.max(0, Math.floor((Date.now() - parsed) / 60000));
}

function fmtMins(mins) {
  if (mins === null || mins === undefined) return '?';
  if (mins < 60) return mins + 'm';
  return Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
}

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit',hour12:true});
}

function statusMatch(job, statuses) {
  const s = (job.workflow_status || job.autoflow_status || job.status || '').toLowerCase().trim();
  return statuses.some(st => s === st.toLowerCase());
}

function bucketOptions(currentStatus) {
  const current = String(currentStatus || '').toLowerCase().trim();
  return `<option value="">Move step...</option>` + BUCKETS.map(b => {
    const value = b.statuses[0];
    const selected = current === value ? 'selected' : '';
    return `<option value="${escHtml(value)}" ${selected}>${escHtml(b.step + ' - ' + b.title)}</option>`;
  }).join('');
}

async function postConfirmation(ro, bucketId, mins) {
  try {
    const bucket = BUCKETS.find(b => b.id === bucketId) || {};
    await fetch('/api/confirm-step', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ro,
        advisor: 'Drew',
        step: bucket.title || bucketId,
        mins_taken: mins,
        source: 'drew_board',
      }),
    });
    return true;
  } catch (err) {
    console.warn('confirmation server post failed; localStorage backup kept', err);
    return false;
  }
}

async function handleOverride(ro, fromStatus, select) {
  const toStatus = select.value;
  if (!toStatus) return;
  try {
    await fetch('/api/override-job', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ro,
        advisor: 'Drew',
        from_status: fromStatus || '',
        to_status: toStatus,
        source: 'drew_board',
      }),
    });
    await loadBoard();
  } catch (err) {
    console.warn('override post failed', err);
  }
}

// -- Render --------------------------------------------------------
function render() {
  if (!boardState) return;
  const jobs = boardState.jobs || [];
  const drewJobs = jobs.filter(j => (j.waiting_on || '').toLowerCase() === 'drew');

  // Find most urgent Callie message
  let urgentMessage = '';
  BUCKETS.filter(b => b.urgent).forEach(b => {
    const bucketJobs = drewJobs.filter(j => statusMatch(j, b.statuses));
    bucketJobs.forEach(j => {
      if (getConfirm(j.ro, b.id)) return;
      const mins = minsAgo(j.status_updated_at);
      if (mins !== null && mins > b.timing * 0.5 && b.callieUrgent && !urgentMessage) {
        urgentMessage = b.callieUrgent(j, mins);
      }
    });
  });

  const banner = document.getElementById('callie-banner');
  const bannerText = document.getElementById('callie-banner-text');
  if (urgentMessage && urgentMessage !== lastCallieMessage) {
    lastCallieMessage = urgentMessage;
    bannerText.textContent = urgentMessage;
    banner.classList.remove('hidden');
  } else if (!urgentMessage) {
    banner.classList.add('hidden');
    lastCallieMessage = '';
  }

  // Summary stats
  let overdue = 0, inQueue = 0, doneToday = 0;
  BUCKETS.forEach(b => {
    drewJobs.filter(j => statusMatch(j, b.statuses)).forEach(j => {
      if (getConfirm(j.ro, b.id)) { doneToday++; return; }
      const mins = minsAgo(j.status_updated_at);
      if (mins !== null && mins > b.timing) overdue++;
      else inQueue++;
    });
  });

  let html = `
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="summary-pill ${overdue > 0 ? 'border border-red-800 bg-red-950/30' : 'border border-zinc-800 bg-zinc-900/50'}">
        <div class="text-[10px] mono uppercase tracking-widest text-zinc-500">Overdue</div>
        <div class="text-4xl font-black ${overdue > 0 ? 'text-red-400' : 'text-zinc-300'}">${overdue}</div>
        <div class="text-xs text-zinc-500">past timing window</div>
      </div>
      <div class="summary-pill ${inQueue > 0 ? 'border border-amber-800 bg-amber-950/20' : 'border border-zinc-800 bg-zinc-900/50'}">
        <div class="text-[10px] mono uppercase tracking-widest text-zinc-500">In Your Queue</div>
        <div class="text-4xl font-black ${inQueue > 0 ? 'text-amber-400' : 'text-zinc-300'}">${inQueue}</div>
        <div class="text-xs text-zinc-500">needs your action</div>
      </div>
      <div class="summary-pill border border-emerald-900 bg-emerald-950/20">
        <div class="text-[10px] mono uppercase tracking-widest text-zinc-500">Done Today</div>
        <div class="text-4xl font-black text-emerald-400">${doneToday}</div>
        <div class="text-xs text-zinc-500">steps confirmed</div>
      </div>
    </div>
  `;

  BUCKETS.forEach(b => {
    const bucketJobs = drewJobs
      .filter(j => statusMatch(j, b.statuses))
      .sort((a,c) => minsAgo(c.status_updated_at) - minsAgo(a.status_updated_at));

    const unconfirmed = bucketJobs.filter(j => !getConfirm(j.ro, b.id));
    const anyOverdue = unconfirmed.some(j => {
      const mins = minsAgo(j.status_updated_at);
      return mins !== null && mins > b.timing;
    });
    const anyWarn = unconfirmed.some(j => {
      const mins = minsAgo(j.status_updated_at);
      return mins !== null && mins > b.timing * 0.6;
    });

    const laneClass = b.urgent && anyOverdue ? 'lane-urgent pulse-urgent' :
                      b.urgent && anyWarn ? 'lane-warn' :
                      unconfirmed.length === 0 && bucketJobs.length > 0 ? 'lane-done' : 'lane-calm';

    const stepColor = b.urgent && anyOverdue ? 'bg-red-900 text-red-300' :
                      b.urgent && anyWarn ? 'bg-amber-900 text-amber-300' : 'bg-zinc-800 text-zinc-400';

    const titleColor = b.urgent && anyOverdue ? 'text-red-300' :
                       b.urgent && anyWarn ? 'text-amber-300' : 'text-zinc-100';

    let cardsHtml = '';
    if (bucketJobs.length === 0) {
      cardsHtml = `<div class="px-5 py-8 text-center text-sm text-zinc-600 mono">Nothing here right now</div>`;
    } else {
      bucketJobs.forEach(j => {
        const conf = getConfirm(j.ro, b.id);
        const mins = minsAgo(j.status_updated_at);
        const isOverdue = mins !== null && mins > b.timing;
        const isWarn = mins !== null && mins > b.timing * 0.6;
        const timeClass = isOverdue ? 'overdue-time' : isWarn ? 'warn-time' : 'ok-time';
        const timeStr = fmtMins(mins) + ' in status';
        const flashClass = !conf && isOverdue && b.urgent ? 'pulse-urgent' : '';
        const ro = String(j.ro || '');
        const note = getNote(ro);
        const noteBadge = note ? `<span class="text-[10px] mono text-violet-300 bg-violet-950/40 border border-violet-800 rounded-full px-2 py-0.5">note</span>` : '';
        const currentStatus = j.workflow_status || j.autoflow_status || j.status || '';

        const confirmHtml = conf
          ? `<div class="text-right">
               <div class="text-[10px] text-emerald-500 mono">[confirmed] confirmed</div>
               <div class="text-[10px] text-zinc-600 mono">${fmtTime(conf.ts)}</div>
             </div>`
          : `<button class="confirm-btn" onclick="handleConfirm('${escJs(ro)}','${b.id}',${mins === null ? 'null' : mins},this)">
               Confirm Done
             </button>`;

        cardsHtml += `
          <div class="job-card rounded-2xl p-4 mx-3 mb-3 ${flashClass}">
            <div class="flex items-start justify-between gap-4">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-base font-black text-zinc-100">${escHtml(j.customer || 'Unknown')}</span>
                  <span class="text-[10px] mono text-zinc-600">RO ${escHtml(ro)}</span>
                  ${noteBadge}
                  ${j.dvi_review_status === 'REWORK_REQUIRED' ? '<a href="/dvi" title="DVI: Rework Required"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-left:4px;vertical-align:middle;box-shadow:0 0 4px #dc2626;"></span></a>' : j.dvi_review_status === 'REVIEW' ? '<a href="/dvi" title="DVI: Needs Review"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d97706;margin-left:4px;vertical-align:middle;box-shadow:0 0 4px #d97706;"></span></a>' : j.dvi_review_status === 'PASS' ? '<a href="/dvi" title="DVI: Clear"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;margin-left:4px;vertical-align:middle;"></span></a>' : ''}
</div>
                <div class="text-xs text-zinc-400 mb-2">${escHtml(j.vehicle || '')}</div>
                <div class="text-xs ${timeClass} mono mb-3">${timeStr}</div>
                <div class="callie-bubble rounded-xl px-3 py-2 text-xs text-zinc-300 leading-relaxed">
                  ${escHtml(b.action)}
                </div>
                <select
                  class="mt-3 w-full rounded-xl bg-zinc-950/80 border border-zinc-800 px-3 py-2 text-xs text-zinc-300 outline-none"
                  onchange="handleOverride('${escJs(ro)}', '${escJs(currentStatus)}', this)"
                >${bucketOptions(currentStatus)}</select>
                <textarea
                  class="mt-3 w-full h-8 focus:h-24 rounded-xl bg-zinc-950/80 border border-zinc-800 px-3 py-2 text-xs text-zinc-200 placeholder:text-zinc-600 outline-none transition-all"
                  placeholder="Add Drew note..."
                  oninput="saveNote('${escJs(ro)}', this.value)"
                >${escHtml(note)}</textarea>
              </div>
              <div class="flex-shrink-0 mt-1">${confirmHtml}</div>
            </div>
          </div>`;
      });
    }

    html += `
      <div class="rounded-3xl ${laneClass} overflow-hidden mb-4">
        <div class="px-5 py-3 flex items-center justify-between border-b border-white/5">
          <div class="flex items-center gap-3">
            <span class="step-badge rounded-lg ${stepColor} px-2 py-1 uppercase">${b.step}</span>
            <span class="font-semibold text-sm ${titleColor}">${b.title}</span>
            <span class="text-xs mono text-zinc-600 bg-zinc-900 rounded-full px-2 py-0.5">${unconfirmed.length}</span>
          </div>
          <button onclick="toggleHelp('${b.id}')" class="text-[11px] text-zinc-600 hover:text-zinc-400 border border-zinc-800 rounded-lg px-2 py-1 transition-colors">
            how?
          </button>
        </div>
        <div id="help-${b.id}" class="help-panel px-5 py-3 border-b border-white/5 bg-zinc-900/50">
          <div class="text-[10px] mono text-violet-400 uppercase tracking-widest mb-2">[Callie] Callie</div>
          <p class="text-xs text-zinc-300 leading-relaxed">${escHtml(b.help)}</p>
        </div>
        <div class="pt-3 pb-1">${cardsHtml}</div>
      </div>`;
  });

  const allJobsHtml = drewJobs.length === 0
    ? `<div class="px-5 py-8 text-center text-sm text-zinc-600 mono">No Drew-owned jobs right now</div>`
    : drewJobs
        .slice()
        .sort((a,c) => String(a.ro || '').localeCompare(String(c.ro || '')))
        .map(j => {
          const ro = String(j.ro || '');
          const note = getNote(ro);
          const noteBadge = note ? `<span class="text-[10px] mono text-violet-300 bg-violet-950/40 border border-violet-800 rounded-full px-2 py-0.5">note</span>` : '';
          const currentStatus = j.workflow_status || j.autoflow_status || j.status || '';
          return `
            <div class="job-card rounded-2xl p-4 mx-3 mb-3">
              <div class="flex items-center justify-between gap-3 mb-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-base font-black text-zinc-100">${escHtml(j.customer || 'Unknown')}</span>
                    <span class="text-[10px] mono text-zinc-600">RO ${escHtml(ro)}</span>
                    ${noteBadge}
${j.dvi_review_status === 'REWORK_REQUIRED' ? '<a href="/dvi" title="DVI: Rework Required"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-left:4px;vertical-align:middle;box-shadow:0 0 4px #dc2626;"></span></a>' : j.dvi_review_status === 'REVIEW' ? '<a href="/dvi" title="DVI: Needs Review"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d97706;margin-left:4px;vertical-align:middle;box-shadow:0 0 4px #d97706;"></span></a>' : j.dvi_review_status === 'PASS' ? '<a href="/dvi" title="DVI: Clear"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;margin-left:4px;vertical-align:middle;"></span></a>' : ''}
                  </div>
                  <div class="text-xs text-zinc-400">${escHtml(j.vehicle || '')}</div>
                </div>
                <div class="text-[10px] mono text-zinc-500 uppercase">${escHtml(currentStatus || 'unknown')}</div>
              </div>
              <select
                class="mb-3 w-full rounded-xl bg-zinc-950/80 border border-zinc-800 px-3 py-2 text-xs text-zinc-300 outline-none"
                onchange="handleOverride('${escJs(ro)}', '${escJs(currentStatus)}', this)"
              >${bucketOptions(currentStatus)}</select>
              <textarea
                class="w-full h-8 focus:h-24 rounded-xl bg-zinc-950/80 border border-zinc-800 px-3 py-2 text-xs text-zinc-200 placeholder:text-zinc-600 outline-none transition-all"
                placeholder="Add Drew note..."
                oninput="saveNote('${escJs(ro)}', this.value)"
              >${escHtml(note)}</textarea>
            </div>`;
        })
        .join('');

  html += `
    <div class="rounded-3xl lane-calm overflow-hidden mb-4">
      <div class="px-5 py-3 flex items-center justify-between border-b border-white/5">
        <div class="flex items-center gap-3">
          <span class="step-badge rounded-lg bg-zinc-800 text-zinc-400 px-2 py-1 uppercase">ALL</span>
          <span class="font-semibold text-sm text-zinc-100">All My Jobs</span>
          <span class="text-xs mono text-zinc-600 bg-zinc-900 rounded-full px-2 py-0.5">${drewJobs.length}</span>
        </div>
      </div>
      <div class="pt-3 pb-1">${allJobsHtml}</div>
    </div>`;

  document.getElementById('main-content').innerHTML = html;
}

async function handleConfirm(ro, bucketId, mins, btn) {
  await postConfirmation(ro, bucketId, mins);
  const msg = saveConfirm(ro, bucketId, mins);
  // Update button area
  const card = btn.closest('.job-card');
  btn.outerHTML = `<div class="text-right">
    <div class="text-[10px] text-emerald-500 mono">[confirmed] confirmed</div>
    <div class="text-[10px] text-zinc-600 mono">${fmtTime(new Date().toISOString())}</div>
  </div>`;
  // Show Callie response
  const callieDiv = card.querySelector('.callie-bubble');
  if (callieDiv) {
    callieDiv.innerHTML = `<span class="text-violet-400 mono text-[10px]">[Callie] Callie - </span>${escHtml(msg)}`;
  }
  card.classList.remove('pulse-urgent');
  setTimeout(render, 500);
}

function toggleHelp(id) {
  const el = document.getElementById('help-' + id);
  if (el) el.classList.toggle('open');
}

function escHtml(v) {
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escJs(v) {
  return String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

async function loadBoard() {
  try {
    const r = await fetch(API, {cache:'no-store'});
    if (!r.ok) throw new Error('failed');
    boardState = await r.json();
  } catch {
    // Keep last state if refresh fails
  }
  render();
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
}

updateClock();
setInterval(updateClock, 1000);
loadBoard();
setInterval(loadBoard, POLL_MS);
</script>
</body>
</html>
